name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing requires npm >=11.5.1. npm 11 supports our Node 22 runtime.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Allocate next version or resume this commit's release
        run: npm run release:prepare
      - run: npm pack --workspaces --dry-run
      - name: Publish core, CLI wrapper, and initializer using npm trusted publishing
        run: npm run release:publish
